# 검정 파이프라인 설정 (연구계획 v3 의 6·7절, 부록 A)
# 이 파일의 해시가 모든 로그 행의 config_hash 로 기록된다. 값을 바꾸면 결과가 다른 run 으로 구분된다.

[symbols]
local = "SKHYNIXUSDT"   # 본주 퍼프 (L)
adr   = "SKHYUSDT"      # ADR 퍼프 (A)
conversion_ratio = 0.1  # 1 ADS = 보통주 0.1주 -> 구조적 후보의 상수 ln(10)

[paths]
raw_dir       = "data/raw"
raw_orderbook_dir = "data/raw_orderbook"   # order_book 변경분 parquet (있으면 분 중간가 사용)
processed_dir = "data/processed"
mid_dir       = "data/processed_mid"
log_dir       = "logs"
report_dir    = "reports"

[calendar]
tz = "Asia/Seoul"
day_start_hour = 8          # 거래일 D = [D 08:00, D+1 07:59]
saturday_start_hour = 9     # 토요일 T0 = 09:00 (6절 연장 구간 확정 시각)
window_mode = "continuous"  # 2026-10-03 결정: 주말·공휴일 포함 연속 윈도우. "blocks" = 계획서 6절 | "continuous" = T0 직전 연속 N분 (주말·공휴일 포함)
v1_minutes = 1440           # continuous 모드의 V1 / V2 길이 (blocks 모드에서는 6절 표를 따름)
v2_minutes = 2880
versions = ["V2"]           # 2026-10-03 결정: 2,880분만 사용. 계획서 원안은 ["V1", "V2"]
# 표본과 겹치는 휴장일만 (16절: 한국 연말 휴장 미확인)
kr_holidays = ["2026-08-17", "2026-09-24", "2026-09-25", "2026-10-05", "2026-10-09"]
us_holidays = ["2026-07-03", "2026-09-07", "2026-11-26", "2026-12-25"]

[data_quality]
max_missing_frac = 0.10     # 13절: 윈도우 결측 10% 초과 -> DATA_BAD
enforce_missing_rule = false  # 2026-10-03 팀 결정: 결측 기준 사용 안 함 (결측 비율은 계속 기록)
min_bars = 240              # 이보다 짧으면 검정 자체를 하지 않음 (DATA_BAD, TOO_SHORT)
exclude_last_bar = true     # 2026-10-03 결정: T0 직전 분봉(07:59)은 T0 이후 도착하므로 제외
# 2026-10-03 결정: 최소 연속구간 기준. 간격 max_gap_min 분 이하로 이어진 구간만 한 구간으로 보고,
# 길이 min_segment_min 분 이상인 구간만 검정에 쓴다 (짧은 조각은 버림). 남는 구간이 없으면 DATA_BAD.
max_gap_min = 5
min_segment_min = 720

[step1]
# 부록 A-5 (2): (a)(d) 엄격, (b)(c) 관대. 최종값은 14절 시뮬레이션으로 확정.
alpha_a_level_adfgls = 0.01   # (a) 수준 ADF-GLS 비기각이어야 함
alpha_b_level_kpss   = 0.10   # (b) 수준 KPSS 기각이어야 함
alpha_c_diff_adfgls  = 0.10   # (c) 차분 ADF-GLS 기각이어야 함
alpha_d_diff_kpss    = 0.01   # (d) 차분 KPSS 비기각이어야 함
gls_cbar = -7.0               # ERS, 상수만
kpss_ar_sum_cap = 0.995       # A-5 (4)
# 게이트에 쓰는 조건. 계획서는 "abcd". 빠진 조건도 통계량·통과 여부는 step1_stats 에 기록된다.
gate_conditions = "abd"     # 2026-10-03 결정: (c) 는 기록만
# (b) 수준 KPSS 판정 방식. "bootstrap" = 계획서(A-2), "table" = 점근 임계값. 둘 다 계산·기록하고 판정만 이 값을 따름.
kpss_b_method = "table"     # 2026-10-03 결정: Step 1 KPSS 는 점근 표 (KPSS 1992 표 1, 상수)
kpss_d_method = "table"
# Step 1 p 값 출처: "plan" = 조건별 스위치 사용 | "bootstrap" = 네 조건 모두 | "table" = 네 조건 모두 점근 표
pvalue_mode = "plan"
# 조건 (c) 차분 ADF-GLS 의 래그 규칙. 계획서대로면 rmaic.
# 주의: 분 수익률에 MAIC/RMAIC 를 쓰면 k 가 상한까지 가서 검정력이 크게 떨어진다
# (참 I(1) 가격 시뮬레이션에서 약 43% 가 조건 c 에서 탈락). "bic" 로 바꾸면 해소. 연구자 결정 사항.
diff_lag_criterion = "rmaic"  # "rmaic" | "maic" | "bic" | "aic"
# (c) 판정 방식. "bootstrap" = 계획서(A-1), "table" = ERS 점근 임계값. 둘 다 기록, 판정만 이 값을 따름.
adfgls_c_method = "bootstrap"

[step3]
alpha = 0.05                  # ADF 또는 KSS 중 하나라도 기각하면 통과
# p 값 출처: "plan" = 계획서(후보1 MacKinnon, 나머지 부트스트랩) | "bootstrap" = 전부 | "table" = 전부 점근 표
pvalue_mode = "plan"
# 게이트 규칙 (2026-10-03): 규칙마다 별도 변형으로 기록. "or" = 7절 원안, "adf" = ADF 단독,
# "kss" = KSS 단독, "minp" = 두 검정 결합 5%. 시뮬레이션 랜덤워크 오통과: or 9.0%, adf 5.6%, kss 6.0%, minp 5.6%
gate_rules = ["adf", "kss"]   # 2026-10-03 팀 결정: ADF·KSS 각자 5% 기준의 별도 버전 (결합 검정 안 함)
dols_max_leads_lags = 5       # DOLS 리드·래그 후보 0..K, BIC 선택
ols_pvalue_source = "mackinnon"   # 후보 1: MacKinnon EG 표 (부트스트랩은 대조용으로 함께 기록)
struct_pvalue_source = "bootstrap" # 후보 4: A-1 부트스트랩 (표 p 도 기록)

[lags]
criterion = "rmaic"           # "maic" | "rmaic"(= Cavaliere et al. 2015 RSMAIC) | "bic" | "aic"
kmax_rule = "schwert12"       # kmax = floor(12 (T/100)^(1/4))
sieve_pmax = 30               # 부트스트랩 sieve AR/VAR 최대 차수 (AIC 선택)

[bootstrap]
B = 199                       # 예비 199 / 운영 999 / 최종 1999
base_seed = 20261003          # 거래일별 시드 = base_seed + YYYYMMDD, V1·V2 공통 난수
weights = "rademacher"

[params]
max_half_life_min = 120       # 9절: 반감기 2시간 이하만 거래. 근거(2026-10-03 갱신): 정산 사이 4시간(240분)의 절반. 60분이면 표본 전 일 탈락(최소 66분)
half_life_method = "arma11"   # 2026-10-03 결정: 호가 잡음 보정 (ARMA(1,1)). AR(1) 값도 함께 기록

# ------------------------------------------------------------------ 매매 (5·9·10절) --
[funding]
raw_dir = "data/raw_funding"
# 펀딩 데이터가 없는 심볼의 가정 시각표 (계획서: 8시간, KST 01/09/17). 데이터가 있으면 실제 정산 시각에서 주기 추정.
default_interval_hours = 8
default_anchor_kst = "2026-09-01 01:00"
buffer_sec = 60            # 5절: 정산 앞뒤 60초 동안 주문(진입·청산) 금지
# 정산 때 포지션 처리. "exit" = 계획서 원안(정산 전 강제 청산), "hold" = 들고 넘기고 펀딩을 손익에 반영 (2026-10-03 팀 결정)
# 근거: 가상 매매 36건 중 16건이 정산 전 강제 청산, 평균 -$13.9. 재진입 왕복 수수료 ~$10 > 펀딩 비용(대개 0, 최대 0.06%)
policy = "hold"
# 임계값 최적화에 넣는 예상 펀딩률: T0 이전에 정산된 최근 forecast_lookback 건 평균
# "signed" = 부호 유지 (기댓값), "abs" = 절댓값 (방향 무관하게 비용으로 보는 보수적 가정)
include_in_thresholds = true
forecast_lookback = 6
forecast_method = "signed"
missing_rate = 0.0         # 펀딩률 기록이 없는 정산의 가정값 (기록 대부분 0). 펀딩 원장에 MISSING_ASSUMED 로 표시
holding_window_sec = 15    # 10절: 정산 전후 15초 안에 포지션이 있으면 보유로 간주

[trading]
capital_usd = 10000        # 배정 자본 C (진입 시 두 레그 명목가치 합)
qty_step = 0.001           # 최소 주문 단위 (계약 규격 미확인 -> 가정)
rearm_after_stop = true    # 손절 뒤 |z| 가 진입선 안쪽으로 돌아와야 재진입
# KSS(비선형) 버전 임계값. "estar" = 윈도우에 ESTAR 를 적합해 그 모형 경로로 임계값 최적화 (src/estar.py),
# 적합 실패(phi 범위 밖, 폭주) 시 선형으로 대체하고 threshold_model 에 표시. "linear" = ADF 버전과 같은 임계값
nonlinear_thresholds = "estar"

[costs]
taker_fee = 0.0005         # VIP0 taker 0.05%, 모든 체결 (팀 계정 수수료 등급 확인 전 가정)
fee_alt = 0.0002           # 민감도: 지정가(maker) 0.02% 로 모두 체결됐다고 볼 때. 미체결 위험은 반영 안 함 -> 상한 참고용
book_depth_levels = 20     # 오더북 VWAP 에 쓰는 호가 단계 수
# 오더북이 없는 분: 다음 분봉 시가 체결 + 다리당 (반 스프레드 + extra_bp) 슬리피지
half_spread_bp = { SKHYNIXUSDT = 0.04, SKHYUSDT = 0.27 }   # 09-18 오더북 재구성 실측 (스프레드 중앙값 / 2)
extra_slippage_bp = 1.0
forced_exit_slippage_mult = 2.0   # 강제 청산 슬리피지 배수
cost_multipliers = [1.0, 1.5, 2.0] # 10절 민감도 (일별 손익에 배수별 열로 기록)

[thresholds]
estar_max_lags = 10              # ESTAR 의 Δz 래그 상한 (BIC 로 선택)
estar_max_explode_frac = 0.01    # ESTAR 시뮬레이션 경로 중 |z|>25 에 닿는 비율이 이보다 크면 선형으로 대체
entry_grid = [0.75, 1.0, 1.25, 1.5, 1.75, 2.0, 2.25, 2.5, 2.75, 3.0]   # 2026-10-04: 0.75 추가 (1.0 이 하한에 붙는 날이 있었음)
exit_grid = [-1.0, -0.75, -0.5, -0.25, 0.0, 0.25, 0.5]   # 2026-10-04: -1.0, -0.75 추가 (28건 모두 하한 -0.5 였음)
stop_grid = [3.0, 4.0, 5.0, 6.0, 99.0]   # 99 = 손절 없음
n_paths = 1000
# 경로 생성 (2026-10-04). ADF 버전: "block_bootstrap" = 윈도우 실제 z 의 정상 블록 부트스트랩 (Politis-Romano),
#   "parametric" = AR(1)+관측잡음 모형 (이전 방식). KSS 버전은 [trading] nonlinear_thresholds 를 따른다.
linear_path_method = "parametric"
block_len_min = 1440            # block_bootstrap 일 때 평균 블록 길이(분). 짧으면 블록 경계마다 z 가 리셋돼 가짜 평균회귀가 생김 (120분: 기대 수익 2~3배 과대)
# 표본 밖 수준 이동: 경로마다 z 에 상수 N(0, tau^2) 를 더한다. tau = T0 이전 거래일들의 "그날 z 평균" 의 RMS
# (윈도우 모수로 계산한 다음 날 z 가 0 에서 얼마나 벗어났는지). 관측이 적으면 기본값.
level_shift = true
level_shift_lookback_days = 10
level_shift_min_obs = 3
level_shift_sd_default = 2.0       # 관측 3일 미만일 때. 2026-09-23~10-01 실측 RMS 1.7~2.1
seed = 20261004
